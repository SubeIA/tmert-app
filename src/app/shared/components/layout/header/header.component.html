<mat-toolbar color="primary" class="toolbar">
  <button mat-icon-button (click)="toggleMenu()" [attr.aria-label]="UI.ARIA_LABELS.TOGGLE_SIDEBAR">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="toolbar-title">TMERT Asistente</span>

  <span class="spacer"></span>

  @if (authService.user(); as user) {
    <button
      mat-icon-button
      [matMenuTriggerFor]="userMenu"
      [attr.aria-label]="UI.ARIA_LABELS.PROFILE_MENU"
    >
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <div class="user-menu-header">
        <div class="user-info">
          <strong>{{ user.name }}</strong>
          <small>{{ user.email }}</small>
        </div>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>{{ UI.NAVIGATION.LOGOUT }}</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>
