<mat-card>
  <mat-card-header>
    <mat-card-title>Gestión de Usuarios</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="actions-bar">
      <button mat-raised-button color="primary" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon>
        Crear Usuario
      </button>
    </div>

    <app-data-table
      [columns]="columns"
      [data]="users()"
      [actions]="actions"
      [loading]="loading()"
      [showPagination]="true"
      [pageSize]="10"
      [showIndex]="true"
      indexHeader="#"
    >
    </app-data-table>
  </mat-card-content>
</mat-card>
