<div class="dialog-header">
  <div class="header-icon" [class.edit-mode]="isEditMode">
    <mat-icon>{{ isEditMode ? 'edit' : 'person_add' }}</mat-icon>
  </div>
  <div class="header-content">
    <h2>{{ isEditMode ? 'Editar Usuario' : 'Nuevo Usuario' }}</h2>
    <p class="subtitle">
      {{
        isEditMode ? 'Actualiza la información del usuario' : 'Completa los datos del nuevo usuario'
      }}
    </p>
  </div>
  <button mat-icon-button class="close-btn" (click)="onCancel()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <form [formGroup]="userForm" class="user-form">
    <app-input
      formControlName="name"
      label="Nombre completo"
      placeholder="Ej: Juan Pérez"
      appearance="outline"
      [required]="true"
      prefixIcon="person"
      hint="Campo obligatorio"
    ></app-input>

    <app-input
      formControlName="email"
      label="Email"
      type="email"
      placeholder="usuario@ejemplo.com"
      appearance="outline"
      [required]="true"
      [readonly]="isEditMode"
      prefixIcon="email"
      hint="Campo obligatorio"
    ></app-input>

    <app-input
      *ngIf="!isEditMode"
      formControlName="password"
      label="Contraseña"
      type="password"
      placeholder="Mínimo 6 caracteres"
      appearance="outline"
      [required]="true"
      prefixIcon="lock"
      hint="Campo obligatorio"
    ></app-input>

    <app-select
      formControlName="role"
      label="Rol"
      [options]="roles"
      appearance="outline"
      [required]="true"
      prefixIcon="admin_panel_settings"
      hint="Campo obligatorio"
    ></app-select>

    <app-select
      formControlName="companies"
      label="Empresas asignadas"
      [options]="companyOptions()"
      [multiple]="true"
      appearance="outline"
      prefixIcon="business"
    ></app-select>
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <div class="actions-container">
    <button mat-stroked-button type="button" (click)="onCancel()" class="cancel-btn">
      <mat-icon>close</mat-icon>
      Cancelar
    </button>
    <button
      mat-raised-button
      color="primary"
      (click)="onSubmit()"
      [disabled]="!userForm.valid"
      class="submit-btn"
    >
      <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
      {{ isEditMode ? 'Guardar Cambios' : 'Crear Usuario' }}
    </button>
  </div>
</mat-dialog-actions>
