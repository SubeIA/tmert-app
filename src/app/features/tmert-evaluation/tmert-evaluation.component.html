<div class="tmert-evaluation-container">
  <app-form-stepper
    [config]="formConfig"
    (formSubmit)="onFormSubmit($event)"
    (formCancel)="onFormCancel()"
  ></app-form-stepper>

  <!-- Floating Chat Assistant -->
  <app-floating-chat
    [title]="'Asistente TMERT'"
    [placeholder]="'Pregunta sobre la evaluación...'"
    (sendMessage)="onChatMessage($event)"
  ></app-floating-chat>
</div>
