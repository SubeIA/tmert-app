<div class="tmert-evaluation-container">
  @if (loading()) {
    <div class="loading-container">
      <mat-spinner></mat-spinner>
      <p>Cargando evaluación...</p>
    </div>
  } @else if (dataLoaded()) {
    <app-form-stepper
      [config]="formConfig"
      [initialStep]="currentStepIndex()"
      [enableTableChat]="true"
      [evaluationId]="evaluationId() ?? ''"
      [companyId]="companyId() ?? ''"
      [userId]="userId"
      (formSubmit)="onFormSubmit($event)"
      (formCancel)="onFormCancel()"
      (stepChange)="onStepChange($event.stepIndex, $event.stepData)"
      (saveProgress)="onSaveProgress($event)"
    ></app-form-stepper>
  }

  <!-- Floating Chat Assistant con integración TMERT API -->
  <app-floating-chat
    [title]="'Asistente TMERT'"
    [placeholder]="'Pregunta sobre la evaluación...'"
    [assistantId]="assistantId"
    [userId]="userId"
    [evaluationId]="evaluationId() ?? undefined"
    [companyId]="companyId() ?? undefined"
    [threadId]="threadId() ?? undefined"
    (threadCreated)="onThreadCreated($event)"
    (messageReceived)="onMessageReceived($event)"
    (errorOccurred)="onChatError($event)"
  ></app-floating-chat>
</div>
