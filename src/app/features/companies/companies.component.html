<div class="companies-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Gestión de Empresas</mat-card-title>
      <button mat-raised-button color="primary" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon>
        Nueva Empresa
      </button>
    </mat-card-header>

    <mat-card-content>
      @if (loading()) {
        <app-table-skeleton [rows]="5" [columns]="5" />
      } @else {
        <app-data-table
          [columns]="columns"
          [data]="companies()"
          [actions]="actions"
          [loading]="false"
          [emptyMessage]="'No hay empresas registradas'"
          [striped]="true"
          [hoverable]="true"
          [showPagination]="true"
          [pageSize]="10"
          [pageSizeOptions]="[5, 10, 25, 50]"
          [showIndex]="true"
          [indexHeader]="'#'"
        />
      }
    </mat-card-content>
  </mat-card>
</div>
