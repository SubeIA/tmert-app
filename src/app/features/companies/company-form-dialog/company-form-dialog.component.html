<div class="dialog-header">
  <div class="header-icon" [class.edit-mode]="isEditMode">
    <mat-icon>{{ isEditMode ? 'edit' : 'add_business' }}</mat-icon>
  </div>
  <div class="header-content">
    <h2>{{ isEditMode ? 'Editar Empresa' : 'Nueva Empresa' }}</h2>
    <p class="subtitle">
      {{
        isEditMode
          ? 'Actualiza la información de la empresa'
          : 'Completa los datos de la nueva empresa'
      }}
    </p>
  </div>
  <button mat-icon-button class="close-btn" (click)="onCancel()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <form [formGroup]="companyForm" class="company-form">
    <app-input
      formControlName="name"
      label="Nombre de la empresa"
      placeholder="Ej: Constructora ABC"
      appearance="outline"
      [required]="true"
      prefixIcon="business"
      hint="Campo obligatorio"
    ></app-input>

    <div class="form-row">
      <app-input
        class="half-width"
        formControlName="rut"
        label="RUT"
        placeholder="76.123.456-7"
        appearance="outline"
        [required]="true"
        hint="Campo obligatorio"
        prefixIcon="badge"
      ></app-input>

      <app-input
        class="half-width"
        formControlName="industry"
        label="Industria"
        placeholder="Construcción, Minería, etc."
        appearance="outline"
        prefixIcon="category"
      ></app-input>
    </div>

    <app-textarea
      formControlName="address"
      label="Dirección"
      placeholder="Av. Libertador 123, Santiago"
      [rows]="2"
      appearance="outline"
      hint=""
    ></app-textarea>
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <div class="actions-container">
    <button mat-stroked-button (click)="onCancel()" class="cancel-btn">
      <mat-icon>close</mat-icon>
      Cancelar
    </button>
    <button
      mat-raised-button
      color="primary"
      (click)="onSubmit()"
      [disabled]="companyForm.invalid"
      class="submit-btn"
    >
      <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
      {{ isEditMode ? 'Guardar Cambios' : 'Crear Empresa' }}
    </button>
  </div>
</mat-dialog-actions>
